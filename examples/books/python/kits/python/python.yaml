# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Python
description: >-
  Python (default 3.12) and uv, with PyPI access (pypi.org,
  files.pythonhosted.org) at install and runtime. Install-only GET access
  to github.com:443 under /astral-sh/python-build-standalone/releases/download/**
  and release-assets.githubusercontent.com:443 for Python builds.
  No compilers or credentials.

args:
  python:
    default: "3.12"
    pattern: '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
    description: Python version

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow:
          - pypi.org
          - files.pythonhosted.org
          - hosts: [github.com:443]
            methods: [GET]
            paths: [/astral-sh/python-build-standalone/releases/download/**]
          - hosts: [release-assets.githubusercontent.com:443]
            methods: [GET]
      runtime:
        allow:
          - pypi.org
          - files.pythonhosted.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            umask 022
            python3 -m venv /opt/uv
            /opt/uv/bin/pip install --no-cache-dir uv
            ln -sf /opt/uv/bin/uv /usr/local/bin/uv
          user: "0"
          description: Install uv from PyPI into a shared venv
        - command: |
            set -eu
            umask 022
            UV_NO_CACHE=1 UV_PYTHON_INSTALL_DIR=/usr/local/share/uv/python UV_PYTHON_BIN_DIR=/usr/local/bin uv python install ${{ kit.args.python }}
          user: "0"
          description: Install the pinned Python with executables on PATH for every user
