name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -timeout 20m ./...
      - name: Homebrew formula renders
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tag=v0.0.0-ci
          i=0
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            i=$((i + 1))
            printf '%064x  stage_%s_%s.tar.gz\n' "$i" "$tag" "$target"
          done > "$RUNNER_TEMP/SHA256SUMS"
          packaging/homebrew/render "$tag" "$RUNNER_TEMP/SHA256SUMS" packaging/homebrew/scoring-stage.rb.tmpl > "$RUNNER_TEMP/scoring-stage.rb"
          ruby -c "$RUNNER_TEMP/scoring-stage.rb"
          while read -r sum archive; do
            grep -A1 -F "/$archive\"" "$RUNNER_TEMP/scoring-stage.rb" | grep -qF "sha256 \"$sum\"" \
              || { echo "$archive is not followed by its sha256"; exit 1; }
          done < "$RUNNER_TEMP/SHA256SUMS"
